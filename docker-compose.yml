services:
  frontend:
    build:
      context: ./frontend
    container_name: motocross-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - fe_be_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: motocross-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - fe_be_net
      - be_db_net
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: motocross-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - be_db_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fe_be_net:
  be_db_net: