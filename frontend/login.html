<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MotoCross Event Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <div class="brand-icon">🏍</div>
    <div class="brand-text">Moto<span>Cross</span></div>
  </a>
  <div class="nav-links">
    <a href="index.html" id="nav-home">Home</a>
    <a href="login.html" id="nav-login">Sign In</a>
    <a href="register.html" id="nav-register">Register</a>
    <a href="reservations.html" id="nav-reservations" style="display:none">My Tickets</a>
    <button id="logout-btn" class="logout-btn" style="display:none">Logout</button>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-logo">
      <div class="auth-logo-icon">🏍</div>
      <div class="auth-logo-title">Welcome back</div>
      <div class="auth-logo-sub">Sign in to manage your reservations</div>
    </div>

    <div class="form-card">
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" id="email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px">Sign In</button>
      </form>
      <p id="message" class="message"></p>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
    </p>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
